global:
  measurements:
  - name: vmiLatency

jobs:
  - name: dv-source
    jobType: create
    jobIterations: {{.ITERATIONS}}
    namespacedIterations: true
    namespace: vm-density
    qps: 20
    burst: 20
    maxWaitTimeout: 1h
    jobPause: 1m
    objects:
    - objectTemplate: templates/dv-source.yml
      replicas: 1
      inputVars:
        url: http://yourwindowsimage.qcow2
        storage: 80Gi
        storageclass: ocs-storagecluster-ceph-rbd-virtualization
        volumemode: Block
    - objectTemplate: templates/dv-volsnap.yml
      replicas: 1
      inputVars:
        volsnapclass: ocs-storagecluster-rbdplugin-snapclass
  - name: virt-density
    jobType: create
    jobIterations: {{.ITERATIONS}}
    qps: 20
    burst: 20
    namespacedIterations: true
    namespace: vm-density
    maxWaitTimeout: 6h
    jobIterationDelay: 1m
    jobPause: 1m
    objects:
    - objectTemplate: templates/vm-dvtemplate-win.yml
      replicas: {{ .OBJ_REPLICAS }}
      inputVars:
        name: vm-dv-density
        OS: win2k25
        cpuCores: 1
        memory: 2Gi
        storage: 80Gi
        storageclass: ocs-storagecluster-ceph-rbd-virtualization
        volumemode: Block
